[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."analyze-saju"]
  timeout = 26

[[redirects]]
  from = "/api/analyze-saju"
  to = "/.netlify/functions/analyze-saju"
  status = 200

[[redirects]]
  from = "/result/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
